<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Iframe Inner Editor</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        margin: 8px;
        padding: 0;
      }
      input, textarea {
        width: 100%;
        box-sizing: border-box;
        margin-bottom: 8px;
        padding: 6px 8px;
        font-size: 14px;
      }
      #iframe-ce {
        min-height: 70px;
        border: 1px solid #cbd5e1;
        padding: 8px;
        font-size: 14px;
        white-space: pre-wrap;
        outline: none;
      }
    </style>
  </head>
  <body>
    <input id="iframe-input" type="text" aria-label="Iframe Input" placeholder="Iframe input..." />
    <textarea id="iframe-textarea" rows="3" cols="40" aria-label="Iframe Textarea" placeholder="Iframe textarea..."></textarea>
    <div id="iframe-ce" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Iframe ContentEditable"></div>
  </body>
</html>
